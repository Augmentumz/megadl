<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign in to MegaDL</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="signin-page">
  <main class="signin">
    <div class="brand signin-brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="var(--amber)"/><path d="M16 8.5v11m0 0-4.6-4.6M16 19.5l4.6-4.6M10 23.5h12" fill="none" stroke="var(--on-amber)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>MegaDL</span>
    </div>
    <form id="signin-form" class="signin-card" autocomplete="on">
      <h1>Sign in</h1>
      <label for="user">User name</label>
      <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      <label for="secret">Password</label>
      <input id="secret" name="current-password" type="password" autocomplete="current-password" required>
      <label class="check remember">
        <input type="checkbox" id="remember" checked>
        <span>Keep me signed in on this device for 30 days</span>
      </label>
      <p id="signin-error" class="form-error" role="alert" hidden></p>
      <button class="btn primary signin-submit" type="submit" id="signin-submit">Sign in</button>
    </form>
    <p class="fine signin-fine">The user name and password are the ones set in MegaDL's container settings on your server.</p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>

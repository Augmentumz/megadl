# For running MegaDL outside Unraid (or testing a local build).
# Unraid users: use the template in unraid/megadl.xml instead.
services:
  megadl:
    build: .
    image: megadl:latest
    container_name: megadl
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "99"
      PGID: "100"
      UMASK: "000"
      DEFAULT_DOWNLOAD_DIR: "downloads"
      HOST_PATH_LABEL: "/srv/media"
      # WEBUI_PASSWORD: "change-me"
    volumes:
      - ./config:/config
      - /srv/media:/data
